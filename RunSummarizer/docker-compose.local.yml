x-app-env: &app-env
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    env_file: [./backend/.env]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  worker:
    env_file: [./backend/.env]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

  migration:
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

volumes:
  postgres-data: